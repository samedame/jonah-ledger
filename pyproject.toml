[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jonah-ledger"
version = "0.1.0"
description = "Paper-only forward ledger for dated stock calls on the @carsandinvesting YouTube channel. Research tool, not financial advice."
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "pandas>=2.1",
    "yfinance>=0.2.40",
    "yt-dlp>=2024.10.0",
    "anthropic>=0.40",
    "tzdata",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jonah-ledger = "jonah_ledger.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
