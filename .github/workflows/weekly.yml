name: weekly
# Saturday scorecard (reports/weekly/) and Discord digest with gate status.
on:
  schedule:
    - cron: "11 15 * * 6"     # Saturday 15:11 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jonah-ledger-data
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - uses: actions/cache@v4
        with:
          path: data/prices_cache
          key: prices-${{ github.run_id }}
          restore-keys: prices-
      - name: Verify ledger
        run: jonah-ledger ledger verify
      - name: Weekly scorecard + digest
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JONAH_ALERTS: ${{ vars.JONAH_ALERTS }}
        run: jonah-ledger weekly
      - name: Commit reports
        run: |
          git config user.name "jonah-ledger-bot"
          git config user.email "jonah-ledger-bot@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "reports: weekly $(date -u +%F) [skip ci]"
          git pull --rebase --autostash
          git push
