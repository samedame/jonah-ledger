name: poll
# discover -> transcript -> extract -> ledger -> alerts. Paper only: no orders, no broker credentials.
on:
  schedule:
    - cron: "7 14 * * *"      # once a day, 14:07 UTC (was every 3 hours; the 60-session score does not need it, and the repo is private so each run is billed)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: jonah-ledger-data
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - uses: actions/cache@v4
        with:
          path: data/prices_cache
          key: prices-${{ github.run_id }}
          restore-keys: prices-
      - name: Verify ledger before touching it
        run: jonah-ledger ledger verify
      - name: Poll
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          JONAH_MODEL: ${{ vars.JONAH_MODEL }}
          JONAH_ALERTS: ${{ vars.JONAH_ALERTS }}
        run: jonah-ledger poll
      - name: Verify ledger after
        run: jonah-ledger ledger verify
      - name: Commit data
        run: |
          git config user.name "jonah-ledger-bot"
          git config user.email "jonah-ledger-bot@users.noreply.github.com"
          git add data reports
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "data: poll $(date -u +%FT%TZ) [skip ci]"
          git pull --rebase --autostash
          git push
